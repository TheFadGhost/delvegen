<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delvegen — procedural dungeon generator</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="toolbar" role="toolbar" aria-label="Main controls">
    <span class="brand">Delvegen</span>

    <label class="field">
      <span class="field-label">Algorithm</span>
      <select id="algorithm-select" aria-label="Algorithm"></select>
    </label>

    <label class="field">
      <span class="field-label">Seed</span>
      <span class="seed-group">
        <button id="seed-back" class="icon-btn" title="Previous seed (Alt+←)" aria-label="Previous seed" disabled>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input id="seed-input" type="text" spellcheck="false" aria-label="Seed" />
        <button id="seed-copy" class="icon-btn" title="Copy seed" aria-label="Copy seed">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="8" height="8" rx="1" fill="none" stroke="currentColor"/><path d="M11 3H4a1 1 0 0 0-1 1v7" fill="none" stroke="currentColor"/></svg>
        </button>
        <button id="seed-dice" class="icon-btn" title="Random seed" aria-label="Random seed">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2.5" fill="none" stroke="currentColor"/><circle cx="5.6" cy="5.6" r="1.1" fill="currentColor"/><circle cx="10.4" cy="10.4" r="1.1" fill="currentColor"/><circle cx="10.4" cy="5.6" r="1.1" fill="currentColor"/><circle cx="5.6" cy="10.4" r="1.1" fill="currentColor"/></svg>
        </button>
        <button id="seed-forward" class="icon-btn" title="Next seed (Alt+→)" aria-label="Next seed" disabled>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </span>
    </label>

    <label class="field">
      <span class="field-label">Size</span>
      <span class="size-group">
        <input id="width-input" type="number" min="5" max="512" step="1" value="80" aria-label="Width in tiles" />
        <span class="x">×</span>
        <input id="height-input" type="number" min="5" max="512" step="1" value="50" aria-label="Height in tiles" />
      </span>
    </label>

    <button id="generate-btn" class="primary">Generate</button>

    <button id="step-mode-btn" class="toggle-btn" aria-pressed="false" title="Record and scrub generation frames">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3 3v10M6 3l7 5-7 5V3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      Step mode
    </button>

    <button id="compare-toggle" class="toggle-btn" aria-pressed="false" title="Compare two configs side by side (Esc exits)">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="1.5" y="3" width="5.5" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="3" width="5.5" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      Compare
    </button>

    <label class="field seed-lock-field disabled-field" id="seed-lock-field" title="When locked, seed edits apply to both panes">
      <input type="checkbox" id="seed-lock" checked disabled />
      <span class="field-label">Lock seed</span>
    </label>

    <span class="spacer"></span>

    <button id="copy-link" class="icon-btn" title="Copy shareable link" aria-label="Copy shareable link">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6.7 9.3l2.6-2.6M7.4 4.6l1.3-1.3a2.6 2.6 0 0 1 3.7 3.7l-1.3 1.3M8.6 11.4l-1.3 1.3a2.6 2.6 0 0 1-3.7-3.7l1.3-1.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>

    <div class="menu-wrap" id="export-wrap">
      <button id="export-btn" aria-haspopup="true" aria-expanded="false" title="Export / import">
        Export
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="export-menu" class="menu hidden" role="menu" aria-label="Export options">
        <button id="export-png" role="menuitem">PNG image</button>
        <button id="export-json" role="menuitem">JSON grid</button>
        <button id="export-ascii" role="menuitem">ASCII text</button>
        <div class="menu-sep" role="separator"></div>
        <button id="import-json" role="menuitem">Import JSON…</button>
      </div>
    </div>

    <label class="field">
      <span class="field-label">Theme</span>
      <select id="theme-select" aria-label="Theme"></select>
    </label>

    <button id="help-btn" class="icon-btn" title="Keyboard shortcuts (?)" aria-label="Help: keyboard shortcuts" aria-haspopup="dialog">?</button>
  </header>

  <div class="frame">
    <aside class="panel left" id="param-panel" aria-label="Parameters">
      <h2 class="section-title">Generation</h2>
      <div id="presets-row" class="chips" aria-label="Presets"></div>
      <button id="surprise-btn" class="wide-btn surprise-btn" title="Randomize all params, seed and post passes">Surprise me</button>
      <div id="params-root" class="params"></div>

      <h2 class="section-title">Post-processing</h2>
      <div id="post-root" class="params"></div>

      <h2 class="section-title">Overlays</h2>
      <div id="overlays-root"></div>
    </aside>

    <main class="stage" id="stage">
      <div class="stage-view" id="stage-view">
        <canvas id="map-canvas" aria-label="Dungeon map"></canvas>
        <div id="empty-state" class="overlay-state">
          <div class="empty-grid" aria-hidden="true"></div>
          <p class="empty-wordmark">Delvegen</p>
          <p class="empty-hint">Choose an algorithm and press <kbd>Generate</kbd></p>
          <p class="empty-kbd"><kbd>G</kbd> generate · drag pan · wheel zoom · <kbd>?</kbd> shortcuts</p>
        </div>
        <div id="failure-state" class="overlay-state hidden" role="alert">
          <p class="failure-title">Generation failed</p>
          <p id="failure-message" class="failure-message"></p>
        </div>
        <div id="status-line" class="status-line" aria-live="polite"></div>
      </div>

      <div id="compare-root" class="compare-root hidden">
        <div class="compare-pane focused" id="pane-a" data-pane="A">
          <div class="pane-canvas-wrap">
            <canvas id="pane-canvas-a" aria-label="Dungeon map pane A"></canvas>
          </div>
          <div class="pane-strip" id="pane-strip-a" aria-live="polite"></div>
        </div>
        <div class="compare-pane" id="pane-b" data-pane="B">
          <div class="pane-canvas-wrap">
            <canvas id="pane-canvas-b" aria-label="Dungeon map pane B"></canvas>
          </div>
          <div class="pane-strip" id="pane-strip-b" aria-live="polite"></div>
        </div>
      </div>

      <div id="transport" class="transport hidden" role="group" aria-label="Generation step transport">
        <button id="step-prev" class="icon-btn" title="Previous frame" aria-label="Previous frame">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10.5 3.5L6 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 3.5v9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button id="step-play" class="icon-btn" title="Play" aria-label="Play or pause playback">
          <svg id="play-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5 3l8 5-8 5V3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <svg id="pause-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" style="display:none"><path d="M5.5 3.5v9M10.5 3.5v9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="step-next" class="icon-btn" title="Next frame" aria-label="Next frame">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5.5 3.5L10 8l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 3.5v9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <input id="step-scrubber" type="range" min="0" max="0" step="1" value="0" aria-label="Frame scrubber" />
        <label class="field transport-speed">
          <span class="field-label">Speed</span>
          <select id="step-speed" aria-label="Playback speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <span id="step-label" class="step-label" aria-live="polite"></span>
      </div>
    </main>

    <aside class="panel right" aria-label="Metrics and legend">
      <h2 class="section-title">Metrics</h2>
      <table class="metrics" id="metrics-table">
        <tbody></tbody>
      </table>
      <button id="verify-determinism" class="wide-btn">Verify determinism</button>
      <div id="selfcheck-line" class="selfcheck-line" role="status"></div>
      <h2 class="section-title">Legend</h2>
      <ul class="legend" id="legend-list"></ul>
      <details id="dist-details" class="dist"></details>
    </aside>
  </div>

  <input type="file" id="import-file" accept=".json,application/json" class="hidden" aria-hidden="true" tabindex="-1" />

  <div id="help-overlay" class="help-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="help-panel">
      <div class="help-head">
        <h2 id="help-title" class="section-title">Keyboard &amp; mouse</h2>
        <button id="help-close" class="icon-btn" title="Close help (Esc)" aria-label="Close help">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <table class="help-table"><tbody></tbody></table>
      <p class="help-note">Shortcuts are ignored while typing in a field.</p>
    </div>
  </div>

  <script type="module" src="/dist/src/ui/main.js"></script>
</body>
</html>
